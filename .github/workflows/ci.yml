name: Validate application
on:
  pull_request:
  push:
    branches: [main, 'release/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ให้ Codecov ยืนยันตัวตนด้วย OIDC แทน CODECOV_TOKEN
      id-token: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xp_test
          POSTGRES_PASSWORD: xp_test
          POSTGRES_DB: notstack_xp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xp_test -d notstack_xp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://xp_test:xp_test@127.0.0.1:5432/notstack_xp_test
      XP_TEST_DATABASE_URL: postgresql://xp_test:xp_test@127.0.0.1:5432/notstack_xp_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SonarQube ต้องใช้ประวัติ git เต็มเพื่อหาโค้ดใหม่ / blame
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm audit --audit-level=moderate
      - run: pnpm lint
      # build ทั้ง backend และหน้าเว็บ (เทสต์ใช้ dist ของ backend / หน้าเว็บต้อง build ผ่านก่อน deploy)
      - run: pnpm build
      # unit test ชุดเดียวกับ pnpm test:unit แต่เก็บ coverage ไว้ที่ coverage/lcov.info
      - run: pnpm test:coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          # PR จาก fork ขอ OIDC token ไม่ได้ ให้ Codecov ใช้โหมด tokenless ของ fork แทน
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          # อัปโหลดไม่ผ่าน (เช่น Codecov ยังไม่ได้เปิดใช้กับ repo) ไม่ทำให้ CI ล้ม
          fail_ci_if_error: false
      # ข้ามเมื่อยังไม่ได้ตั้ง secret SONAR_TOKEN หรือเป็น PR จาก fork (ไม่ได้รับ secret)
      - id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "enabled=${{ env.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - run: pnpm db:migrate
      - run: pnpm --filter @notstack/backend exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # ทุกไฟล์ *-database.test.cjs (ชุดเดียวกับ pnpm test:integration) — ไฟล์ใหม่ไม่ต้องมาเพิ่มชื่อที่นี่
      - run: node --test tests/*-database.test.cjs
