name: Validate application
on:
  pull_request:
  push:
    branches: [main, 'release/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xp_test
          POSTGRES_PASSWORD: xp_test
          POSTGRES_DB: notstack_xp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xp_test -d notstack_xp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://xp_test:xp_test@127.0.0.1:5432/notstack_xp_test
      XP_TEST_DATABASE_URL: postgresql://xp_test:xp_test@127.0.0.1:5432/notstack_xp_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # build ทั้ง backend และหน้าเว็บ (เทสต์ใช้ dist ของ backend / หน้าเว็บต้อง build ผ่านก่อน deploy)
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm db:migrate
      - run: pnpm --filter @notstack/backend exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: node --test tests/xp-database.test.cjs
