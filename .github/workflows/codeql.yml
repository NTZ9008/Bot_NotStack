name: CodeQL
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  schedule:
    - cron: '0 3 * * 1'
permissions: {}
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # อัปโหลดผลเข้าแท็บ Security > Code scanning
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          # TS วิเคราะห์จาก source ได้เลย ไม่ต้อง build
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
