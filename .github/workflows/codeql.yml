name: CodeQL
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  schedule:
    - cron: '0 3 * * 1'
permissions: {}
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # อัปโหลดผลเข้าแท็บ Security > Code scanning
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # TS วิเคราะห์จาก source ได้เลย ไม่ต้อง build
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
