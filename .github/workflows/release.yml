name: Release
# merge release/vX.Y.Z เข้า main แล้ว: ถ้า version ใน package.json ยังไม่มี tag จะติด tag vX.Y.Z
# และสร้าง GitHub Release พร้อม changelog (รายการ PR ตั้งแต่ tag ก่อนหน้า จัดหมวดตาม .github/release.yml)
on:
  push:
    branches: [main]
    paths: [package.json]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag มีอยู่แล้ว ข้าม"; exit 0; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes --latest
