name: Deploy BotNotStack

# กด Deploy backend เองจากแท็บ Actions
# frontend deploy แยกผ่าน Cloudflare Workers ตาม apps/frontend/wrangler.jsonc
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    # อนุญาตให้กด Deploy ได้เฉพาะ branch main และ branch ที่ขึ้นต้นด้วย release/ เท่านั้น
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build backend
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@notstack/backend...

      # ไฟล์ที่เซิร์ฟเวอร์ต้องใช้เท่านั้น (ไม่มีหน้าเว็บ) — package.json ของ frontend ติดไปด้วยเพื่อให้ lockfile ตรงกับ workspace
      - name: Prepare backend bundle
        run: |
          mkdir -p bundle/apps/backend bundle/apps/frontend bundle/packages/shared
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml ecosystem.config.cjs bundle/
          cp -r apps/backend/dist apps/backend/prisma apps/backend/scripts apps/backend/package.json apps/backend/prisma.config.ts bundle/apps/backend/
          cp apps/frontend/package.json bundle/apps/frontend/
          cp -r packages/shared/dist packages/shared/package.json bundle/packages/shared/

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Upload (rsync)
        run: |
          echo "กำลังอัปโหลดไฟล์ไปยัง Server..."
          # --delete ลบไฟล์ของเวอร์ชันก่อนที่ไม่ได้ใช้แล้ว — ยกเว้นไฟล์บนเซิร์ฟเวอร์ที่ต้องเก็บไว้
          # (.env, log, node_modules, ข้อมูล SQLite เดิม, Prisma client ที่ generate ตอนติดตั้ง)
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
            --exclude '.env*' \
            --exclude 'node_modules' \
            --exclude '/logs' \
            --exclude '/levels*.json' \
            --exclude '/database.sqlite' \
            --exclude '/prbot' \
            --exclude 'apps/backend/src/generated' \
            --delete bundle/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/arlifzs/BotNotStack/

      - name: Install Dependencies, Migrate & Restart PM2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e
            source ~/.bashrc
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\"
            export PATH=\"\$PATH:\$HOME/.local/bin\"

            cd /home/arlifzs/BotNotStack
            command -v pnpm >/dev/null || corepack enable pnpm || npm install -g pnpm@10.6.5

            echo 'Installing dependencies...'
            pnpm --filter '@notstack/backend...' install --frozen-lockfile --prod

            echo 'Applying Prisma migrations...'
            pnpm db:migrate

            echo 'Restarting PM2 process...'
            pm2 delete BotNotStack || true
            pm2 start ecosystem.config.cjs
            pm2 save
          "
          echo "Deploy backend สำเร็จแล้ว! 🚀"
