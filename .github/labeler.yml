# ติด label ให้ PR ตามไฟล์ที่แก้ (actions/labeler) — label ที่ยังไม่มีใน repo จะถูกสร้างให้อัตโนมัติ
backend:
  - changed-files:
      - any-glob-to-any-file: apps/backend/**

frontend:
  - changed-files:
      - any-glob-to-any-file: apps/frontend/**

shared:
  - changed-files:
      - any-glob-to-any-file: packages/shared/**

database:
  - changed-files:
      - any-glob-to-any-file:
          - apps/backend/prisma/**

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**
          - scripts/test-*.mjs

ci:
  - changed-files:
      - any-glob-to-any-file: .github/**

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - pnpm-lock.yaml
          - '**/package.json'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - '**/*.md'

monitoring:
  - changed-files:
      - any-glob-to-any-file: monitoring/**
