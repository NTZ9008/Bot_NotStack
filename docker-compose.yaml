services:
  postgres-test:
    image: postgres:18
    container_name: postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password

    ports:
      - "5439:5432"

    volumes:
      - postgres-test-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-test-data:
