<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bot NotStack Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 10vh auto;
            text-align: center;
        }
        .login-container .card {
            padding: 2.5rem;
            border-radius: 10px; /* คืนความโค้งให้การ์ดหน้า Login */
        }
        .login-container h2 {
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        .form-group-login {
            margin-bottom: 1rem;
            text-align: left;
        }
        .form-group-login label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .form-group-login input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.875rem 1rem;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }
        .form-group-login input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .btn-login {
            width: 100%;
            margin-top: 1.5rem;
            justify-content: center;
        }
        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
        }
        .login-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--card-border);
        }
        .btn-discord {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            background: #5865F2;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .btn-discord:hover {
            background: #4752C4;
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="login-container">
        <div class="logo" style="margin-bottom: 1.5rem;">
            <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Bot Logo">
        </div>
        
        <div class="card">
            <h2>BotNotStack Dashboard</h2>
            <form id="login-form">
                <div class="form-group-login">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group-login">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn-login" id="login-btn">
                    Login
                </button>
                <div id="error-msg" class="error-message">Invalid username or password</div>
            </form>

            <div id="discord-login" class="hidden">
                <div class="login-divider">หรือ</div>
                <a href="/api/auth/discord" class="btn-discord">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                    เข้าสู่ระบบด้วย Discord
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            btn.innerHTML = '<div class="spinner" style="width: 20px; height: 20px; margin: 0; border-width: 2px;"></div>';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'เข้าสู่ระบบสำเร็จ!',
                        text: 'กำลังพาท่านไปยังหน้า Dashboard...',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = '/';
                    });
                } else {
                    const data = await res.json();
                    Swal.fire({
                        icon: 'error',
                        title: 'เข้าสู่ระบบล้มเหลว',
                        text: data.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',
                        confirmButtonColor: '#6366f1'
                    });
                    btn.innerHTML = 'Login';
                    btn.disabled = false;
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'เชื่อมต่อไม่สำเร็จ',
                    text: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่',
                    confirmButtonColor: '#6366f1'
                });
                btn.innerHTML = 'Login';
                btn.disabled = false;
            }
        });

        // ข้อความ error ที่ส่งกลับมาจาก Discord OAuth (/login?error=...)
        const LOGIN_ERRORS = {
            discord_denied: 'คุณยกเลิกการเข้าสู่ระบบด้วย Discord',
            discord_state: 'ลิงก์เข้าสู่ระบบหมดอายุหรือไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง',
            discord_failed: 'ติดต่อ Discord ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง',
            discord_disabled: 'ระบบยังไม่ได้เปิดใช้การเข้าสู่ระบบด้วย Discord',
            account_disabled: 'บัญชีนี้ถูกปิดใช้งาน กรุณาติดต่อผู้ดูแลระบบ',
        };

        (async () => {
            // มี refresh token ค้างอยู่ (เช่นเปิดลิงก์จากที่อื่นแล้ว access token หมดอายุ) → ต่ออายุแล้วเข้า Dashboard เลย
            const refreshed = await fetch('/api/auth/refresh', { method: 'POST' }).catch(() => null);
            if (refreshed && refreshed.ok) return window.location.replace('/');

            const providers = await fetch('/api/auth/providers').then(r => r.json()).catch(() => ({}));
            if (providers.discord) document.getElementById('discord-login').classList.remove('hidden');

            const errorCode = new URLSearchParams(window.location.search).get('error');
            if (errorCode) {
                history.replaceState(null, '', '/login');
                Swal.fire({
                    icon: 'error',
                    title: 'เข้าสู่ระบบไม่สำเร็จ',
                    text: LOGIN_ERRORS[errorCode] || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง',
                    confirmButtonColor: '#6366f1'
                });
            }
        })();

        // รองรับการกด Enter เพื่อล็อกอิน
        const handleEnter = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('login-btn').click();
            }
        };
        document.getElementById('username').addEventListener('keypress', handleEnter);
        document.getElementById('password').addEventListener('keypress', handleEnter);
    </script>
</body>
</html>
