<!doctype html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Bot NotStack Dashboard</title>
    <style>
      /* Splash ตอนเปิดเว็บ — แสดงทันทีจาก HTML ก่อน JavaScript/CSS หลักโหลดเสร็จ (React ใช้ class เดียวกันใน SplashScreen) */
      html.dark,
      html.dark body {
        background: #0f172a;
      }
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(60rem 30rem at 50% 35%, rgba(99, 102, 241, 0.16), transparent 70%), #0f172a;
        color: #e2e8f0;
        font-family: 'Inter Variable', 'Noto Sans Thai Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        z-index: 50;
      }
      .app-splash__logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        box-shadow: 0 10px 40px -8px rgba(99, 102, 241, 0.65);
        animation: app-splash-float 2.4s ease-in-out infinite;
      }
      .app-splash__name {
        margin: 6px 0 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .app-splash__bar {
        position: relative;
        width: 168px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.18);
      }
      .app-splash__bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #6366f1, #a5b4fc);
        animation: app-splash-progress 1.25s ease-in-out infinite;
      }
      .app-splash__label {
        margin: 0;
        font-size: 13px;
        color: #94a3b8;
      }
      @keyframes app-splash-progress {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @keyframes app-splash-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__logo,
        .app-splash__bar span {
          animation: none;
        }
        .app-splash__bar span {
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash" role="status" aria-live="polite" aria-label="กำลังโหลด...">
        <svg class="app-splash__logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#6366f1" />
          <rect x="8" y="11" width="16" height="12" rx="4" fill="#fff" />
          <circle cx="13" cy="17" r="1.8" fill="#6366f1" />
          <circle cx="19" cy="17" r="1.8" fill="#6366f1" />
          <rect x="15" y="6" width="2" height="5" rx="1" fill="#fff" />
        </svg>
        <p class="app-splash__name">NotStack Dashboard</p>
        <div class="app-splash__bar"><span></span></div>
        <p class="app-splash__label">กำลังโหลด...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
