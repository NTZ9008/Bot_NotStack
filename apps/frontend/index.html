    <script>
      // ธีมสว่าง/มืด: ใส่ class ก่อนวาดหน้า จะได้ไม่กะพริบ (ค่าเริ่มต้นตามระบบ) — ต้องตรงกับ src/hooks/use-theme.ts
      try {
        if (localStorage.getItem('lang') === 'en') document.documentElement.lang = 'en';
        var t = localStorage.getItem('theme');
        if (t === 'classic' || t === 'christmas') document.documentElement.classList.add('dark', t);
        else if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <!-- ไม่มี JavaScript: ซ่อน splash ให้เห็นเนื้อหาที่ build ใส่ไว้ใน #root -->
    <noscript><style>.app-splash{display:none}</style></noscript>
    <style>
      /* Splash ตอนเปิดเว็บ — แสดงทันทีจาก HTML ก่อน JavaScript/CSS หลักโหลดเสร็จ (React ใช้ class เดียวกันใน SplashScreen) */
      html,
      body {
        background: #f5f6fd;
      }
      html.dark,
      html.dark body {
        background: #060818;
      }
      /* เนื้อหาที่ build ใส่ไว้ล่วงหน้าใน #root (src/lib/seo.ts) — อยู่ใต้ splash, React แทนที่ตอนโหลดเสร็จ */
      .seo-prerender {
        max-width: 48rem;
        margin: 0 auto;
        padding: 2rem 1rem;
        color: #27272a;
        line-height: 1.7;
        font-family: 'Noto Sans Thai Variable', ui-sans-serif, system-ui, sans-serif;
      }
      .seo-prerender h1 {
        font-size: 2rem;
        font-weight: 800;
      }
      .seo-prerender h2 {
        margin-top: 1.5rem;
        font-size: 1.25rem;
        font-weight: 700;
      }
      .seo-prerender ul,
      .seo-prerender ol {
        padding-left: 1.25rem;
        list-style: revert;
      }
      .seo-prerender a {
        color: #1d4ed8;
      }
      html.dark .seo-prerender {
        color: #e2e8f0;
      }
      html.dark .seo-prerender a {
        color: #a5b4fc;
      }
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5f6fd;
        color: #1f1f1f;
        font-family: 'Inter Variable', 'Noto Sans Thai Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        z-index: 50;
      }
      html.classic,
      html.classic body,
      html.classic .app-splash {
        background: #0f172a;
      }
      html.dark .app-splash {
        background: #060818;
        color: #ededed;
      }
      /* 🎄 ธีมคริสต์มาส (ชั่วคราว): พื้นเขียวสน ; body โปร่งให้เห็นหิมะ (body::before ใน index.css) ที่อยู่ระหว่างพื้นกับเนื้อหา */
      html.christmas,
      html.christmas .app-splash {
        background: #05120d;
      }
      html.christmas body {
        background: transparent;
      }
      html.dark .app-splash__label {
        color: #a3a3a3;
      }
      .app-splash__logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        box-shadow: 0 10px 40px -8px rgba(42, 69, 255, 0.6);
        animation: app-splash-float 2.4s ease-in-out infinite;
      }
      .app-splash__name {
        margin: 6px 0 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .app-splash__bar {
        position: relative;
        width: 168px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.18);
      }
      .app-splash__bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2a45ff, #8a9bff);
        animation: app-splash-progress 1.25s ease-in-out infinite;
      }
      .app-splash__label {
        margin: 0;
        font-size: 13px;
        color: #6b6b6b;
      }
      @keyframes app-splash-progress {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @keyframes app-splash-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__logo,
        .app-splash__bar span {
          animation: none;
        }
        .app-splash__bar span {
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>

    <div id="root">
      <div class="app-splash" role="status" aria-live="polite" aria-label="กำลังโหลด...">

          <rect x="8" y="11" width="16" height="12" rx="4" fill="#fff" />
          <circle cx="13" cy="17" r="1.8" fill="#2a45ff" />
          <circle cx="19" cy="17" r="1.8" fill="#2a45ff" />
          <rect x="15" y="6" width="2" height="5" rx="1" fill="#fff" />
        </svg>
        <p class="app-splash__name">NotStack Dashboard</p>
        <div class="app-splash__bar"><span></span></div>
        <p class="app-splash__label">กำลังโหลด...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
