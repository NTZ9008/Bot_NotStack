<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#4f46e5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAccent" cx="80%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="botGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="barIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <linearGradient id="barCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="barEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glowCenter)" />
  <rect width="1200" height="630" fill="url(#glowAccent)" />

  <!-- Decorative orbit rings -->
  <circle cx="600" cy="315" r="250" fill="none" stroke="#6366f1" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="8 10" />
  <circle cx="600" cy="315" r="340" fill="none" stroke="#818cf8" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Dashboard Mockup Backdrop Card (Left) -->
  <g transform="translate(130, 145)">
    <rect width="310" height="340" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Window dots -->
    <circle cx="28" cy="28" r="6" fill="#f43f5e" fill-opacity="0.8" />
    <circle cx="48" cy="28" r="6" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="68" cy="28" r="6" fill="#10b981" fill-opacity="0.8" />
    <rect x="24" y="54" width="262" height="1.5" fill="#334155" fill-opacity="0.6" />

    <!-- Stat rows / XP & Level bars -->
    <rect x="28" y="80" width="90" height="14" rx="7" fill="#94a3b8" fill-opacity="0.35" />
    <rect x="28" y="106" width="254" height="14" rx="7" fill="#1e293b" />
    <rect x="28" y="106" width="196" height="14" rx="7" fill="url(#barIndigo)" />

    <rect x="28" y="144" width="115" height="14" rx="7" fill="#94a3b8" fill-opacity="0.35" />
    <rect x="28" y="170" width="254" height="14" rx="7" fill="#1e293b" />
    <rect x="28" y="170" width="150" height="14" rx="7" fill="url(#barCyan)" />

    <rect x="28" y="208" width="76" height="14" rx="7" fill="#94a3b8" fill-opacity="0.35" />
    <rect x="28" y="234" width="254" height="14" rx="7" fill="#1e293b" />
    <rect x="28" y="234" width="220" height="14" rx="7" fill="url(#barEmerald)" />

    <!-- Toggle switches row -->
    <rect x="28" y="276" width="118" height="38" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="42" y="289" width="44" height="12" rx="6" fill="#64748b" fill-opacity="0.4" />
    <rect x="102" y="285" width="32" height="20" rx="10" fill="#6366f1" />
    <circle cx="124" cy="295" r="7" fill="#ffffff" />

    <rect x="164" y="276" width="118" height="38" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="178" y="289" width="44" height="12" rx="6" fill="#64748b" fill-opacity="0.4" />
    <rect x="238" y="285" width="32" height="20" rx="10" fill="#10b981" />
    <circle cx="260" cy="295" r="7" fill="#ffffff" />
  </g>

  <!-- Dashboard Feature Widgets Backdrop Card (Right) -->
  <g transform="translate(760, 145)">
    <rect width="310" height="340" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Weather / Morning card -->
    <rect x="26" y="26" width="258" height="86" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="70" cy="69" r="20" fill="#fbbf24" />
    <path d="M78 82 H112 A13 13 0 0 0 112 56 A17 17 0 0 0 80 50 A14 14 0 0 0 78 82 Z" fill="#e2e8f0" />
    <rect x="136" y="50" width="96" height="14" rx="7" fill="#e2e8f0" fill-opacity="0.6" />
    <rect x="136" y="74" width="64" height="12" rx="6" fill="#38bdf8" fill-opacity="0.5" />

    <!-- Security / Voice Guard shield card -->
    <rect x="26" y="128" width="122" height="92" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <path d="M87 146 L111 156 V174 C111 190 100 201 87 206 C74 201 63 190 63 174 V156 Z" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M79 176 L85 182 L97 170" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- GitHub PR / Branch card -->
    <rect x="162" y="128" width="122" height="92" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="202" cy="156" r="7" fill="none" stroke="#34d399" stroke-width="3" />
    <circle cx="202" cy="194" r="7" fill="none" stroke="#34d399" stroke-width="3" />
    <circle cx="244" cy="175" r="7" fill="none" stroke="#a78bfa" stroke-width="3" />
    <line x1="202" y1="163" x2="202" y2="187" stroke="#34d399" stroke-width="3" />
    <path d="M209 156 C226 156 226 175 237 175" fill="none" stroke="#a78bfa" stroke-width="3" />

    <!-- Activity / Notification bars -->
    <rect x="26" y="236" width="258" height="78" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="60" cy="275" r="16" fill="#6366f1" fill-opacity="0.3" />
    <circle cx="60" cy="275" r="8" fill="#818cf8" />
    <rect x="90" y="261" width="140" height="12" rx="6" fill="#cbd5e1" fill-opacity="0.5" />
    <rect x="90" y="281" width="96" height="10" rx="5" fill="#64748b" fill-opacity="0.45" />
  </g>

  <!-- Center Hero Bot Emblem -->
  <g transform="translate(460, 175)">
    <!-- Outer soft halo -->
    <rect x="-20" y="-20" width="320" height="320" rx="84" fill="#6366f1" fill-opacity="0.15" />
    <rect x="-6" y="-6" width="292" height="292" rx="74" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="2" />

    <!-- Main Bot Rounded Square -->
    <rect width="280" height="280" rx="68" fill="url(#botGrad)" />

    <!-- Antenna -->
    <rect x="130" y="46" width="20" height="44" rx="10" fill="#ffffff" />
    <circle cx="140" cy="42" r="14" fill="#a5b4fc" />
    <circle cx="140" cy="42" r="8" fill="#ffffff" />

    <!-- Robot Face Visor -->
    <rect x="66" y="92" width="148" height="112" rx="36" fill="#ffffff" />

    <!-- Robot Eyes -->
    <circle cx="112" cy="148" r="16" fill="#4f46e5" />
    <circle cx="168" cy="148" r="16" fill="#4f46e5" />
    <circle cx="117" cy="143" r="5" fill="#ffffff" />
    <circle cx="173" cy="143" r="5" fill="#ffffff" />

    <!-- Subtle Smile / Status Bar -->
    <rect x="122" y="176" width="36" height="8" rx="4" fill="#a5b4fc" />

    <!-- Online Status Badge -->
    <circle cx="246" cy="246" r="28" fill="#0f172a" />
    <circle cx="246" cy="246" r="18" fill="#10b981" />
  </g>

  <!-- Floating sparkles / nodes -->
  <circle cx="485" cy="120" r="6" fill="#818cf8" fill-opacity="0.7" />
  <circle cx="725" cy="510" r="8" fill="#38bdf8" fill-opacity="0.6" />
  <circle cx="465" cy="495" r="5" fill="#34d399" fill-opacity="0.7" />
  <circle cx="735" cy="130" r="5" fill="#fbbf24" fill-opacity="0.7" />
</svg>
