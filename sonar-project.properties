# SonarQube Cloud (sonarcloud.io) — ค่า key ตรงกับที่ SonarQube Cloud ตั้งให้อัตโนมัติตอน import repo จาก GitHub
sonar.organization=ntz9008
sonar.projectKey=NTZ9008_Bot_NotStack
sonar.projectName=Bot_NotStack
sonar.sources=apps/backend/src,apps/frontend/src,packages/shared/src
sonar.tests=tests
sonar.exclusions=**/generated/**,**/dist/**,**/*.gen.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# shadcn-tailwind.css ใช้ไวยากรณ์ Tailwind v4 (@custom-variant, @slot, CSS nesting) ที่ตัววิเคราะห์ CSS ของ Sonar ยังไม่รู้จัก → ข้าม false positive สองกฎนี้เฉพาะไฟล์นี้
sonar.issue.ignore.multicriteria=twcss1,twcss2
sonar.issue.ignore.multicriteria.twcss1.ruleKey=css:S8767
sonar.issue.ignore.multicriteria.twcss1.resourceKey=apps/frontend/src/styles/shadcn-tailwind.css
sonar.issue.ignore.multicriteria.twcss2.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.twcss2.resourceKey=apps/frontend/src/styles/shadcn-tailwind.css
# สคริปต์ dev และ UI component/route ของหน้าเว็บไม่มีชุดเทสต์ที่วัด coverage (เทสต์หน้าเว็บโหลดแค่ src/lib) — ยังตรวจ issue ตามปกติ แค่ไม่นับ coverage
sonar.coverage.exclusions=scripts/**,apps/frontend/src/features/**,apps/frontend/src/routes/**,apps/frontend/src/components/**
