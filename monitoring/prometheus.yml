global:
    scrape_interval: 15s
    evaluation_interval: 15s
rule_files:
    - /etc/prometheus/alerts.yml
scrape_configs:
    - job_name: notstack
      metrics_path: /api/metrics
      scrape_timeout: 10s
      authorization:
          type: Bearer
          credentials_file: /etc/prometheus/metrics-token
      static_configs:
          # Backend running on the Docker host. Change for remote deployments.
          - targets: ['host.docker.internal:3035']
